name: Bug report
description: Something in job-harness does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove personal details (name, email, phone, employer names you do not want public) from anything you paste. For a job site that stopped returning results, use "A job site stopped working" instead. For security problems, do not use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. job panel
        2. ...
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options: ["Plugin (Claude desktop app)", "Plugin (terminal)", "Clone of the repository"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: job-harness version
      description: Shown by `job doctor`, or in `.claude-plugin/plugin.json`.
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: Output of `job doctor`
      render: text
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `candidates/<name>/logs/<date>.log`, with personal details removed.
      render: text
    validations:
      required: false
