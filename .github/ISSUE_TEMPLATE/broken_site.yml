name: A job site stopped working
description: A search returns nothing, or returns the wrong thing, from SEEK, LinkedIn, WA Government Jobs or another source
labels: ["broken-site"]
body:
  - type: markdown
    attributes:
      value: |
        Sites change their pages. A quick report helps us fix it. Please check first that it is not a rate limit: lines with `HTTP 429` in the log mean the site is asking you to slow down, and trying again the next day is the fix.
  - type: dropdown
    id: site
    attributes:
      label: Which site
      options: [SEEK, LinkedIn, WA Government Jobs, Greenhouse, Lever, Workable, SmartRecruiters, Ashby, Adzuna, Other]
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: What you see
      description: "For example: 0 jobs found for days, ads without descriptions, an error code, wrong locations."
    validations:
      required: true
  - type: input
    id: since
    attributes:
      label: Since when
      description: The first day it stopped, if you know it.
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The lines for that site from `candidates/<name>/logs/<date>.log`, or the output of `job discover <name> --dry`. Remove personal details.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The site works in my normal browser at the same time.
        - label: I did not run discovery many times in a row.
